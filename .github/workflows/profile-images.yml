name: Generate Profile Images

on:
  # 毎日 日本時間 0:00 (UTC 15:00) に実行
  schedule:
    - cron: "0 15 * * *"
  # 手動実行も可能にする
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate Snake
        uses: HibikiHata/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Generate 3D contribution images
        uses: HibikiHata/github-profile-3d-contrib@9e3f937195cf840d364388973f73e3c4b3753586
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Move 3D images into dist
        run: mv profile-3d-contrib/* dist/

      - name: Generate Breakout game
        uses: HibikiHata/github-breakout@60c43dca3a1361fbc9fb9bb533b5193296345c4f
        with:
          github_username: ${{ github.repository_owner }}
          output_path: breakout

      - name: Move Breakout images into dist
        run: |
          mv breakout/light.svg dist/github-breakout-light.svg
          mv breakout/dark.svg dist/github-breakout-dark.svg

      - name: Push to the output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update profile images [skip ci]"
